<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operation on String in Javascript</title>

    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="main-container">

        <div class="header-title">
            Operation on string in Javascript
        </div>

        <div class="content-area">

            <div class="mb-4 text-center">
                <textarea id="stringInput"
                    class="form-control"
                    rows="3"
                    placeholder="Add paragraph here"></textarea>
            </div>

            <div class="text-center">
                <div class="result-pill">Result</div>

                <div id="resultDisplay" class="result-output">
                    ---
                </div>
            </div>

            <div class="row g-3 row-cols-2 row-cols-sm-4">

                <div class="col">
                    <button class="btn btn-string w-100 shadow-sm"
                        onclick="checkVowels()">
                        Check Vowels
                    </button>
                </div>

                <div class="col">
                    <button class="btn btn-string w-100 shadow-sm"
                        onclick="checkConsonants()">
                        Check consonants
                    </button>
                </div>

                <div class="col">
                    <button class="btn btn-string w-100 shadow-sm"
                        onclick="countSpaces()">
                        Count spaces
                    </button>
                </div>

                <div class="col">
                    <button class="btn btn-string w-100 shadow-sm"
                        onclick="countNewLines()">
                        Count new lines
                    </button>
                </div>

                <div class="col">
                    <button class="btn btn-string w-100 shadow-sm"
                        onclick="convertToSmall()">
                        Convert to small case
                    </button>
                </div>

                <div class="col">
                    <button class="btn btn-string w-100 shadow-sm"
                        onclick="capitalize()">
                        Capitalise
                    </button>
                </div>

                <div class="col">
                    <button class="btn btn-string w-100 shadow-sm"
                        onclick="titleCase()">
                        Title Case
                    </button>
                </div>

                <div class="col">
                    <button class="btn btn-string w-100 shadow-sm"
                        onclick="checkPalindrome()">
                        Check palindrome
                    </button>
                </div>

                <div class="col">
                    <button class="btn btn-string w-100 shadow-sm"
                        onclick="extractFirstWord()">
                        Extract First Word
                    </button>
                </div>

                <div class="col">
                    <button class="btn btn-string w-100 shadow-sm"
                        onclick="replaceSpaces()">
                        Replace all spaces with hyphens
                    </button>
                </div>

                <div class="col">
                    <button class="btn btn-string w-100 shadow-sm"
                        onclick="reverseCharacters()">
                        Reverse the characters
                    </button>
                </div>

                <div class="col">
                    <button class="btn btn-string w-100 shadow-sm"
                        onclick="sortWords()">
                        Sort the words
                    </button>
                </div>

            </div>

        </div>
    </div>

    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    
    <script src="script.js"></script>

</body>
</html>
