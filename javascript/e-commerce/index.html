<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
  <h1 class="display-3 bg-info text-white shadow-2 p-4 text-center">E-Commerce</h1>

  <nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Batch98</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="#">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">About Us</a>
          </li>

          <li class="nav-item">
            <a class="nav-link " href="#">Contact Us</a>
          </li>
        </ul>
        <div class="d-flex" role="search">

          <a class="btn btn-outline-light" href="./Cart.html">Cart
            <sup class="badge badge-pill text-bg-danger" id="cartLength">0</sup>

          </a>

        </div>
      </div>
    </div>
  </nav>
  <div class="container w-50 mt-4 border border-1 p-4"
    style="background-image: linear-gradient(rgb(203, 240, 255), rgb(94, 220, 255));">
    <div class="form-floating mb-3">
      <input type="text" class="form-control" id="Name" placeholder="name">
      <label for="Name">Product Name</label>
    </div>
    <div class="form-floating mb-3">
      <input type="text" class="form-control" id="Category" placeholder="Category">
      <label for="Category">Category</label>
    </div>
    <div class="form-floating mb-3">
      <input type="number" class="form-control" id="Price" placeholder="Price">
      <label for="Price">Price</label>
    </div>
    <div class="form-floating mb-3">
      <input type="number" class="form-control" id="Stock" placeholder="Stock">
      <label for="Stock">Stock</label>
    </div>
    <button class="btn btn-primary w-100" id="addNewBtn">Add New Product</button>
  </div>
  <div class="container mt-4">
    <div class="row" id="productList"></div>
  </div>

  <script src="./script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
