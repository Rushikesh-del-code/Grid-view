<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
    <h1 class="dispaly-3 text-center">Task Managment</h1>
    <div class="container">
       <div> Total Tasks : <i id="TotalTasksCount" class="badge text-bg-secondary"></i></div>
       <div> Completed Tasks : <i id="CompleteTasksCount"></i></div>
       <div> InComplete Tasks : <i id="InCompleteTasksCount"></i></div>


    </div>
    <div class="container">
        <input type="text" id="inputTask" placeholder="Enter new task"> 
        <button id="addBTN" class="btn btn-primary">Add New Task</button>
    </div>
    <div class="container">
        <table class="table table-striped table-primary">
  <thead>
    <tr>
      <th scope="col">#</th>
      <th scope="col">Task Name</th>
      <th scope="col">Status</th>
      <th scope="col">Action</th>
    </tr>
  </thead>
  <tbody id="tasksRows"></tbody>
</table>
    </div>

    <script src="./script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
