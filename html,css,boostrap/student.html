<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Admission Form</title>
</head>
<body>

    <h1 align="center">Student Admission Form</h1>

    <form>
        
       
       <div>
            <label for="fullName">Full Name:</label>
            <input type="text" id="fullName" name="fullName" required>
       </div><br>

       
        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
       </div><br>

       
       <div>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
       </div><br>

       
        <div>
            <label for="mobile">Mobile Number:</label>
            <input type="tel" id="mobile" name="mobile" required>
       </div><br>

        
        <div>
            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob" required>
        </div><br>

       
        <div>
            <label>Gender:</label>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>
            
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>
            
            <input type="radio" id="other" name="gender" value="other">
            <label for="other">Other</label>
        </div><br>

        
       <div>
            <label>Hobbies:</label>
            <input type="checkbox" id="reading" name="hobbies" value="reading">
            <label for="reading">Reading</label>
            
            <input type="checkbox" id="sports" name="hobbies" value="sports">
            <label for="sports">Sports</label>
            
            <input type="checkbox" id="music" name="hobbies" value="music">
            <label for="music">Music</label>
        </div><br>

       
        <div>
            <label for="address">Address:</label><br>
            <textarea id="address" name="address" rows="4" cols="30" required></textarea>
       </div><br>
       
       <div>
            <label for="course">Course:</label>
            <select id="course" name="course" required>
                <option value=""></option>
                <option value="computer_science">Computer Science</option>
                <option value="information_technology">Information Technology</option>
                <option value="business_administration">Business Administration</option>
                <option value="engineering">Engineering</option>
            </select>
       </div><br>
       
        <div>
            <label for="profilePic">Profile Picture:</label>
            <input type="file" id="profilePic" name="profilePic" accept="image/*">
      </div><br>

       
       <div>
            <label for="favColor">Favorite Color:</label>
            <input type="color" id="favColor" name="favColor" value="#ff0000">
       </div><br>

        
        <div>
            <label for="skillsLevel">Skills Level:</label>
            <input type="range" id="skillsLevel" name="skillsLevel" min="0" max="100" value="50">
       </div><br>
        
        <div>
            <button type="submit">Submit</button>
            <button type="reset">Reset</button>
        </div><br>

    </form>

</body>
</html>
